# Beamo Wipe CI — Google Cloud Build, project beamo-wipe only.
# This is the project's CI gate. GitHub Actions is not used.
#
#   ./scripts/ci-cloud.sh
#
# GitHub App triggers (same project; see scripts/install-cloud-triggers.sh):
#   - Pull requests targeting main (beamo-wipe-pr-gate, QEMU skipped)
#   - Pushes to main (beamo-wipe-main-gate, full gate incl. QEMU)
#
# Secret-free. Does not deploy by default. Tests use fake lsblk JSON and never exec
# nwipe on a real disk. ISO build runs in privileged Docker on amd64.
# QEMU runs on the build worker (TCG where KVM is absent) against a
# disposable qcow2 created by scripts/qemu-verify.sh — no host disks.
# Verification builds are ephemeral. `_PUBLISH_RELEASE=true` is an explicit,
# post-QEMU production action; its publisher refuses skipped gates and writes
# a unique, no-overwrite build path with the completion marker last.

timeout: 7200s
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 200
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _SKIP_ISO: "false"
  _SKIP_QEMU: "false"
  _PUBLISH_RELEASE: "false"

steps:
  - id: lint
    name: debian:bookworm@sha256:6ebd97fa83deb272194a2cf015b3d26a4d538e9ad3a7a79d544c8af5b0a01443
    waitFor: ['-']
    entrypoint: bash
    args:
      - -ceu
      - |
        chmod +x scripts/ci-hosted.sh scripts/test-all.sh
        ./scripts/ci-hosted.sh lint

  - id: python-tests
    name: debian:bookworm@sha256:6ebd97fa83deb272194a2cf015b3d26a4d538e9ad3a7a79d544c8af5b0a01443
    waitFor: ['-']
    entrypoint: bash
    args:
      - -ceu
      - |
        chmod +x scripts/ci-hosted.sh scripts/test-all.sh scripts/build-iso.sh
        ./scripts/ci-hosted.sh tests

  - id: preview
    name: debian:bookworm@sha256:6ebd97fa83deb272194a2cf015b3d26a4d538e9ad3a7a79d544c8af5b0a01443
    waitFor: ['-']
    entrypoint: bash
    args:
      - -ceu
      - |
        chmod +x scripts/ci-hosted.sh preview
        ./scripts/ci-hosted.sh preview

  - id: negative-test
    name: debian:bookworm@sha256:6ebd97fa83deb272194a2cf015b3d26a4d538e9ad3a7a79d544c8af5b0a01443
    waitFor: ['python-tests', 'lint', 'preview']
    entrypoint: bash
    args:
      - -ceu
      - |
        chmod +x scripts/ci-hosted.sh scripts/test-all.sh
        ./scripts/ci-hosted.sh negative

  - id: iso-build
    name: debian:bookworm@sha256:6ebd97fa83deb272194a2cf015b3d26a4d538e9ad3a7a79d544c8af5b0a01443
    waitFor: ['negative-test']
    entrypoint: bash
    env:
      - SKIP_ISO=${_SKIP_ISO}
      - BEAMO_WIPE_VERSION=0.2.1
    args:
      - -ceu
      - |
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends ca-certificates docker.io git python3
        chmod +x scripts/ci-hosted.sh scripts/build-iso.sh
        ./scripts/ci-hosted.sh iso

  - id: qemu-verify
    name: debian:bookworm@sha256:6ebd97fa83deb272194a2cf015b3d26a4d538e9ad3a7a79d544c8af5b0a01443
    waitFor: ['iso-build']
    entrypoint: bash
    env:
      - SKIP_QEMU=${_SKIP_QEMU}
      - BEAMO_WIPE_VERSION=0.2.1
    args:
      - -ceu
      - |
        chmod +x scripts/ci-hosted.sh scripts/qemu-verify.sh scripts/build-iso.sh
        ./scripts/ci-hosted.sh qemu

  - id: publish-release
    name: debian:bookworm@sha256:6ebd97fa83deb272194a2cf015b3d26a4d538e9ad3a7a79d544c8af5b0a01443
    waitFor: ['qemu-verify']
    entrypoint: bash
    env:
      - PUBLISH_RELEASE=${_PUBLISH_RELEASE}
      - SKIP_ISO=${_SKIP_ISO}
      - SKIP_QEMU=${_SKIP_QEMU}
      - BEAMO_WIPE_VERSION=0.2.1
      - BUILD_ID=$BUILD_ID
    args:
      - -ceu
      - |
        apt-get update -qq
        apt-get install -y -qq --no-install-recommends ca-certificates git python3
        python3 scripts/publish_release_gcs.py
