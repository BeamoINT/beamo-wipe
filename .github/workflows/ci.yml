name: CI

# GitHub Actions is billing-blocked on this org and never gates merges.
# The hosted gate is Google Cloud Build in project beamo-wipe
# (cloudbuild.yaml / ./scripts/ci-cloud.sh). See docs/ci.md.

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Unit tests (no real disks)
        run: python -m pytest
        env:
          BEAMO_WIPE_DRY_RUN: "1"
