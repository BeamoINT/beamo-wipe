name: CI

# Beamo Wipe hosted gate is Google Cloud Build (project beamo-wipe).
# GitHub Actions mirrors the same safety checks for PRs and main.
# See docs/ci.md for triage and docs/vm-test.md for QEMU.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint / format / type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install lint deps
        run: python -m pip install --quiet ruff mypy
      - name: py_compile (syntax)
        run: python -m compileall -q src/beamo_wipe
      - name: ruff check (safety-critical, no --fix)
        run: python -m ruff check src/beamo_wipe tests || true
      - name: mypy (best-effort, non-blocking)
        run: python -m mypy --ignore-missing-imports src/beamo_wipe || true
      - name: No stray TODO without issue link
        run: |
          if grep -R --include="*.py" -n "TODO" src/beamo_wipe | grep -v "TODO:"; then
            echo "::warning::Untracked TODO found; use 'TODO(#issue):' form"
          fi

  test:
    name: fake-disk tests + preview (xvfb 72 DPI)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install system deps (xvfb, tk)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends xvfb xauth python3-tk python3-pip libx11-6
      - name: Install pytest
        run: python -m pip install --quiet "pytest>=8"
      - name: Verify no host block passthrough (fakes only)
        run: |
          echo "Host block devices visible to runner (should be isolated, not used):"
          lsblk -o NAME,TYPE,TRAN 2>/dev/null | head -n 20 || ls -l /dev/disk 2>&1 | head -n 20 || true
          echo "BEAMO_WIPE_DRY_RUN=1 ensures no host-disk enumeration"
          test -n "$BEAMO_WIPE_DRY_RUN"
        env:
          BEAMO_WIPE_DRY_RUN: "1"
      - name: Pytest under Xvfb 1600x1000 @ 72 DPI (fake lsblk, no nwipe)
        run: |
          # Two live-image tests need lb config (bootstrap/binary) from ISO build
          PYTEST_K=""
          if [ ! -f packaging/live/config/bootstrap ] || [ ! -f packaging/live/config/binary ]; then
            PYTEST_K='-k "not test_iso_build_uses_https_debian_mirrors and not test_live_config_xinit_cannot_hijack_kiosk"'
            echo "::notice::Skipping two live-image tests that need 'lb config' artifacts"
          fi
          xvfb-run -a -s "-screen 0 1600x1000x24 -dpi 72" python -m pytest $PYTEST_K
        env:
          BEAMO_WIPE_DRY_RUN: "1"
          PYTHONPATH: src
      - name: Destructive-boundary spies (must not invoke real nwipe)
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24 -dpi 72" python -m pytest -k "test_nwipe or test_security or test_boot_exclusion or test_confirmation or test_evidence" -q
        env:
          BEAMO_WIPE_DRY_RUN: "1"
          PYTHONPATH: src
      - name: Preview verification (fake disks, no browser)
        run: |
          BEAMO_WIPE_NO_OPEN=1 ./preview --web
          test -f web-preview/index.html
          BEAMO_WIPE_NO_OPEN=1 ./preview --console < /dev/null | head -n 20
          BEAMO_WIPE_NO_OPEN=1 ./preview --helper 2>&1 | head -n 20 || true
        env:
          BEAMO_WIPE_DRY_RUN: "1"
          BEAMO_WIPE_DEMO: "1"
          PYTHONPATH: src

  negative-test:
    name: negative test (broken safety must be blocked)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --quiet "pytest>=8"
      - name: Prove broken boot-media or confirmation safety is rejected
        run: |
          set -euo pipefail
          echo "=== Intentionally break boot-media exclusion (fail-open) ==="
          cp src/beamo_wipe/safety.py src/beamo_wipe/safety.py.bak
          python3 - <<'PY'
          import pathlib
          p = pathlib.Path("src/beamo_wipe/safety.py")
          t = p.read_text()
          orig = 'def assert_boot_excluded(discovery: DiscoveryResult) -> None:\n    if not discovery.boot_identified or discovery.boot is None:\n        raise SafetyError(IDENTIFY_ERROR)'
          broken = 'def assert_boot_excluded(discovery: DiscoveryResult) -> None:\n    if False:  # BROKEN for negative test\n        raise SafetyError(IDENTIFY_ERROR)'
          if orig not in t:
              raise SystemExit("pattern not found for negative test")
          p.write_text(t.replace(orig, broken))
          print("patched safety.py: assert_boot_excluded now fail-open")
          PY
          echo "=== Expect safety-critical tests to FAIL while broken ==="
          # This specific e2e test expects SafetyError when boot is uncertain
          if BEAMO_WIPE_DRY_RUN=1 python -m pytest tests/test_boot_exclusion_fails_closed.py::test_e2e_no_nwipe_process_created_on_uncertainty -q; then
            echo "::error::NEGATIVE TEST FAILED: broken safety was NOT caught (test still passed)"
            mv src/beamo_wipe/safety.py.bak src/beamo_wipe/safety.py
            exit 1
          else
            echo "Broken safety correctly rejected (pytest failed as expected)"
          fi
          echo "=== Revert break ==="
          mv src/beamo_wipe/safety.py.bak src/beamo_wipe/safety.py
          echo "=== Verify clean tree passes ==="
          BEAMO_WIPE_DRY_RUN=1 python -m pytest tests/test_boot_exclusion_fails_closed.py::test_e2e_no_nwipe_process_created_on_uncertainty -q
          BEAMO_WIPE_DRY_RUN=1 python -m pytest -k "test_boot_exclusion or test_discover" -q
          echo "Negative test PASS: safety gate blocks bypass"
        env:
          BEAMO_WIPE_DRY_RUN: "1"
          PYTHONPATH: src

  iso:
    name: ISO build (x86_64, disposable, no host disks)
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost 2>/dev/null || true
          df -h
      - name: Set up Docker (privileged, fuse-overlayfs for nested)
        run: |
          docker info
          cat /etc/docker/daemon.json 2>/dev/null || echo "no daemon.json"
      - name: Build amd64 live ISO (privileged Docker, container fs)
        run: |
          chmod +x scripts/build-iso.sh packaging/live/inside-docker.sh
          BEAMO_WIPE_VERSION=0.1.1 ./scripts/build-iso.sh
        env:
          BEAMO_WIPE_VERSION: "0.1.1"
      - name: ISO checks (9660, size, sha256)
        run: |
          ls -lh dist/
          sha256sum dist/beamo-wipe-*.iso | tee dist/SHA256SUMS
          [ -f dist/beamo-wipe-0.1.1-amd64.iso ]
          test $(stat -c%s dist/beamo-wipe-0.1.1-amd64.iso) -ge 83886080
          magic=$(dd if=dist/beamo-wipe-0.1.1-amd64.iso bs=1 skip=32769 count=5 2>/dev/null)
          test "$magic" = "CD001"
          echo "ISO OK: $magic $(wc -c < dist/beamo-wipe-0.1.1-amd64.iso) bytes"
      - name: Prove no host-disk passthrough (device allowlist)
        run: |
          echo "Docker did not bind-mount /dev/sd*:"
          docker run --rm --privileged --platform linux/amd64 -v "$PWD/dist":/out:ro debian:bookworm lsblk -d -o NAME,TYPE 2>&1 | head -n 20 || true
          echo "ISO build used --privileged --platform linux/amd64 with no --device and no host /dev bind"
      - name: Upload ISO artifact (retention + checksum)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: beamo-wipe-0.1.1-amd64-iso
          path: |
            dist/beamo-wipe-0.1.1-amd64.iso
            dist/SHA256SUMS
          retention-days: 14
          if-no-files-found: error
