name: QEMU destructive-path verification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/beamo_wipe/**"
      - "packaging/live/**"
      - "scripts/qemu-verify.sh"
      - ".github/workflows/qemu-verify.yml"

permissions:
  contents: read

concurrency:
  group: qemu-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qemu-verify:
    name: QEMU verify (x86_64, disposable qcow2, no host disks)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install host deps (qemu, ovmf, squashfs, pytest)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            qemu-system-x86 qemu-utils ovmf \
            squashfs-tools genisoimage \
            python3-tk xvfb \
            kpartx fdisk
          python -m pip install --quiet "pytest>=8"
          qemu-system-x86_64 --version
          qemu-img --version
          ls -l /dev/kvm || echo "KVM not available (TCG fallback, still safe)"
      - name: Build ISO if missing (privileged Docker, container fs)
        run: |
          if [ ! -f dist/beamo-wipe-0.1.1-amd64.iso ]; then
            echo "ISO not in dist, building (this may take ~10m)..."
            BEAMO_WIPE_VERSION=0.1.1 ./scripts/build-iso.sh
          else
            ls -lh dist/beamo-wipe-0.1.1-amd64.iso
            sha256sum dist/beamo-wipe-0.1.1-amd64.iso | head
          fi
      - name: Run controlled QEMU verification (disposable /tmp qcow2)
        run: |
          chmod +x scripts/qemu-verify.sh
          BEAMO_WIPE_VERSION=0.1.1 ./scripts/qemu-verify.sh
        env:
          BEAMO_WIPE_DRY_RUN: "1"
          PYTHONPATH: src
      - name: Upload QEMU evidence (retention + checksum, no secrets)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qemu-verify-evidence
          path: |
            /tmp/beamo-wipe-qemu-evidence/
            dist/SHA256SUMS
          retention-days: 14
          if-no-files-found: warn
