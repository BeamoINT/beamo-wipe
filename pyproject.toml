[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beamo-wipe"
version = "0.2.2"
description = "Guided nwipe front-end and live USB for Beamo Wipe."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [{ name = "Jack Allison / Beamo" }]
keywords = ["nwipe", "disk-erase", "live-usb"]

[project.urls]
Homepage = "https://github.com/BeamoINT/beamo-wipe"
Source = "https://github.com/BeamoINT/beamo-wipe"

[project.scripts]
beamo-wipe = "beamo_wipe.app:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
beamo_wipe = ["demo_lsblk.json", "demo_empty.json", "demo_blocked.json", "assets/*.png", "assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
