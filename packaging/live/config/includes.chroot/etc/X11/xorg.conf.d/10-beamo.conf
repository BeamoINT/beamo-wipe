# If Xorg cannot find a mouse, still start (live USB, keyboard only).
# Do not pin a VESA Device section: with no BusID that forces every GPU
# onto VBE, which UEFI machines (no legacy VBIOS) cannot start.
# Let X probe: modesetting/simpledrm, native KMS, fbdev, then vesa if VBE exists.
#
# BlankTime is display blanking only (screensaver). A key or mouse click
# unblanks. StandbyTime/SuspendTime/OffTime stay 0 so DPMS does not power
# the panel down in a way that is easy to confuse with OS sleep.
# systemd sleep remains disabled separately; this file does not suspend.
Section "ServerFlags"
    Option "AllowMouseOpenFail" "true"
    Option "BlankTime" "10"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

# Shipped default is US QWERTY. The wizard may apply us/fr/de for this
# X session only. It does not write this file, so a kiosk restart returns here.
Section "InputClass"
    Identifier "Beamo keyboard"
    MatchIsKeyboard "on"
    Option "XkbLayout" "us"
    Option "XkbVariant" ""
    Option "XkbOptions" ""
EndSection
