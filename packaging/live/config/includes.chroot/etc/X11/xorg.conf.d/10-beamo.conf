# If Xorg cannot find a mouse, still start (live USB, keyboard only).
Section "ServerFlags"
    Option "AllowMouseOpenFail" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

# VESA is the boring driver that still works in QEMU and on old PCs.
# Faster native drivers remain installed; X may still pick them when they work.
Section "Device"
    Identifier "BeamoVGA"
    Driver "vesa"
EndSection
