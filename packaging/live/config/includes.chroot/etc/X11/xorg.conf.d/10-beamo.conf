# If Xorg cannot find a mouse, still start (live USB, keyboard only).
# Do not pin a VESA Device section: with no BusID that forces every GPU
# onto VBE, which UEFI machines (no legacy VBIOS) cannot start.
# Let X probe: modesetting/simpledrm, native KMS, fbdev, then vesa if VBE exists.
Section "ServerFlags"
    Option "AllowMouseOpenFail" "true"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
